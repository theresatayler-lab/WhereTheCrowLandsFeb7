<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Camera body -->
  <rect x="2" y="6" width="20" height="14" rx="2"/>
  <!-- Lens housing -->
  <circle cx="12" cy="13" r="4"/>
  <!-- Inner lens -->
  <circle cx="12" cy="13" r="2" opacity="0.5"/>
  <!-- Lens reflection -->
  <path d="M10.5 11.5c.5-.5 1.5-.5 2 0" opacity="0.3"/>
  <!-- Viewfinder -->
  <rect x="8" y="4" width="8" height="3" rx="0.5"/>
  <!-- Flash -->
  <circle cx="18" cy="9" r="1" opacity="0.5"/>
  <!-- Shutter button -->
  <rect x="14" y="4.5" width="2" height="1.5" rx="0.5" opacity="0.4"/>
</svg>
