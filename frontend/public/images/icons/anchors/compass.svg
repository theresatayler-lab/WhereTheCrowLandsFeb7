<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Compass circle -->
  <circle cx="12" cy="12" r="9.5"/>
  <!-- Inner circle -->
  <circle cx="12" cy="12" r="1"/>
  <!-- North pointer (filled) -->
  <path d="M12 11l-2 5 2-2 2 2-2-5z"/>
  <!-- South pointer (open) -->
  <path d="M12 13l-2-5 2 2 2-2-2 5z" opacity="0.5"/>
  <!-- Cardinal marks -->
  <path d="M12 2.5v2" opacity="0.6"/>
  <path d="M12 19.5v2" opacity="0.6"/>
  <path d="M2.5 12h2" opacity="0.6"/>
  <path d="M19.5 12h2" opacity="0.6"/>
  <!-- Cardinal letters -->
  <text x="12" y="6.5" text-anchor="middle" font-size="3" fill="currentColor" stroke="none" font-family="serif" opacity="0.6">N</text>
  <text x="12" y="20.5" text-anchor="middle" font-size="3" fill="currentColor" stroke="none" font-family="serif" opacity="0.6">S</text>
</svg>
